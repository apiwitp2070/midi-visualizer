<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/piano.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MIDI</title>
    <meta name="description" content="MIDI Player and visualization" />
    <meta name="color-scheme" content="light dark" />
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("midi-theme");
          var isDark =
            stored === "dark" || stored === "light"
              ? stored === "dark"
              : window.matchMedia("(prefers-color-scheme: dark)").matches;
          document.documentElement.classList.toggle("dark", isDark);
        } catch (e) {
          /* Private mode or blocked storage: fall back to the light default. */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
