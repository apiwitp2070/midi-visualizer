<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/piano.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MIDI Visualizer</title>
    <meta
      name="description"
      content="Watch a MIDI file play across a piano keyboard, learn it note by note, and record your own playing."
    />
    <meta name="color-scheme" content="light dark" />
    <meta
      name="theme-color"
      content="#faf8f5"
      media="(prefers-color-scheme: light)"
    />
    <meta
      name="theme-color"
      content="#14131a"
      media="(prefers-color-scheme: dark)"
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap"
      rel="stylesheet"
    />
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("midi-theme");
          var isDark =
            stored === "dark" || stored === "light"
              ? stored === "dark"
              : window.matchMedia("(prefers-color-scheme: dark)").matches;
          document.documentElement.classList.toggle("dark", isDark);
        } catch (e) {
          /* Private mode or blocked storage: fall back to the light default. */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
